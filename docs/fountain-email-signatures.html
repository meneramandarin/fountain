<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fountain email signatures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body style="margin:0; padding:40px 24px; background:#efe9dc; color:#1e1a0f; font-family:'Geist', 'Geist Fallback', ui-sans-serif, system-ui, sans-serif;">
    <main style="max-width:680px; margin:0 auto;">
      <p style="margin:0 0 28px; font-size:13px; line-height:1.5; color:#6c624f;">Fountain email signature concepts · warm, editorial, and intentionally simple for reliable email-client rendering.</p>

      <!-- Marlene Ronstedt -->
      <section style="margin:0 0 28px; padding:28px; background:#f7f0e1; border:1px solid #decfb5;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; width:100%; max-width:480px;">
          <tr>
            <td style="padding:0 0 18px; border-bottom:2px solid #c39d60;">
              <img src="https://fountain.clinic/fountain-wordmark.png" width="169" height="56" alt="Fountain" style="display:block; border:0; outline:none; text-decoration:none;" />
            </td>
          </tr>
          <tr>
            <td style="padding:19px 0 0;">
              <div style="font-size:20px; line-height:1.25; font-weight:700; color:#1e1a0f;">Marlene Ronstedt</div>
              <div style="margin-top:4px; font-size:14px; line-height:1.4; color:#c39d60; font-weight:700; letter-spacing:.08em; text-transform:uppercase;">Founder</div>
              <div style="margin-top:18px; font-size:15px; line-height:1.7;">
                <a href="mailto:marlene@fountain.clinic" style="color:#1e1a0f; text-decoration:none;">marlene@fountain.clinic</a>
                <span style="padding:0 7px; color:#c39d60;">·</span>
                <a href="https://fountain.clinic" style="color:#1e1a0f; text-decoration:none;">fountain.clinic</a>
              </div>
            </td>
          </tr>
        </table>
      </section>

      <!-- General inbox -->
      <section style="margin:0 0 28px; padding:28px; background:#f7f0e1; border:1px solid #decfb5;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; width:100%; max-width:480px;">
          <tr>
            <td style="padding:0 0 18px; border-bottom:2px solid #c39d60;">
              <img src="https://fountain.clinic/fountain-wordmark.png" width="169" height="56" alt="Fountain" style="display:block; border:0; outline:none; text-decoration:none;" />
            </td>
          </tr>
          <tr>
            <td style="padding:19px 0 0;">
              <div style="margin-top:4px; font-size:14px; line-height:1.4; color:#c39d60; font-weight:700; letter-spacing:.08em; text-transform:uppercase;">General inquiries</div>
              <div style="margin-top:18px; font-size:15px; line-height:1.7;">
                <a href="mailto:hello@fountain.clinic" style="color:#1e1a0f; text-decoration:none;">hello@fountain.clinic</a>
                <span style="padding:0 7px; color:#c39d60;">·</span>
                <a href="https://fountain.clinic" style="color:#1e1a0f; text-decoration:none;">fountain.clinic</a>
              </div>
            </td>
          </tr>
        </table>
      </section>

      <!-- Bookings inbox -->
      <section style="padding:28px; background:#f7f0e1; border:1px solid #decfb5;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse; width:100%; max-width:480px;">
          <tr>
            <td style="padding:0 0 18px; border-bottom:2px solid #c39d60;">
              <img src="https://fountain.clinic/fountain-wordmark.png" width="169" height="56" alt="Fountain" style="display:block; border:0; outline:none; text-decoration:none;" />
            </td>
          </tr>
          <tr>
            <td style="padding:19px 0 0;">
              <div style="margin-top:4px; font-size:14px; line-height:1.4; color:#c39d60; font-weight:700; letter-spacing:.08em; text-transform:uppercase;">Clinic bookings</div>
              <div style="margin-top:18px; font-size:15px; line-height:1.7;">
                <a href="mailto:bookings@fountain.clinic" style="color:#1e1a0f; text-decoration:none;">bookings@fountain.clinic</a>
                <span style="padding:0 7px; color:#c39d60;">·</span>
                <a href="https://fountain.clinic" style="color:#1e1a0f; text-decoration:none;">fountain.clinic</a>
              </div>
            </td>
          </tr>
        </table>
      </section>
    </main>
  </body>
</html>
